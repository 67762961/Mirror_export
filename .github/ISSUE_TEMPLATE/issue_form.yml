name: 📝 通用问题/需求反馈
description: 报告 Bug、请求新功能或模式适配
title: "[Type]: "
labels: ["triage"]
body:
  # 1. 问题分类下拉框
  - type: dropdown
    id: issue-type
    attributes:
      label: 🔍 问题类型
      description: 请选择本次反馈的类型
      options:
        - 🐞 Bug Report (缺陷报告)
        - ✨ Feature Request (新功能请求)
        - 🔧 Mode Adaptation (模式适配)
    validations:
      required: true

  # 2. 版本输入框
  - type: input
    id: version
    attributes:
      label: 🏷️ 软件版本
      description: 请填写你当前使用的版本号
      placeholder: "例如: v2.5.9 或 v3.0.0-beta"
    validations:
      required: true

  - type: input
    id: module-name
    attributes:
      label: 📦 涉及模块
      description: "请简要说明出现问题的模块名称 (例如: Auth, Dashboard, Parser)"
      placeholder: "例如: DataParser / LoginModule"
    validations:
      required: true

  # 4. 详细描述 (Markdown 框)
  - type: textarea
    id: description
    attributes:
      label: 📝 详细描述
      description: |
        **Bug/适配问题**：请描述复现步骤、期望行为、实际行为。
        **新功能**：请描述使用场景、核心价值、预期效果。
      placeholder: |
        1. 在什么环境下操作？
        2. 具体执行了什么步骤？
        3. 期望的结果是什么？
        4. 实际的结果是什么？
    validations:
      required: true

  # 5. 合并区域：日志、数据与截图
  - type: textarea
    id: evidence
    attributes:
      label: 📊 异常日志 / 数据 / 截图
      description: |
        请粘贴相关的错误日志、堆栈信息或异常数据表格。
        如有必要，请直接拖拽图片到此框，或点击上传截图。
      placeholder: |
        (在此处粘贴截图...)
    validations:
      required: false

  # 6. 自查清单
  - type: checkboxes
    id: checklist
    attributes:
      label: ✅ 提交前确认
      options:
        - label: 我已搜索过现有 Issue 确认没有重复
          required: true
        - label: 我已阅读相关文档/Wiki
          required: false
        - label: 我愿意协助测试或提供更多信息
          required: false
